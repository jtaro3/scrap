  .view-options button.selected{background:#6b7446;border-color:#f5d58b;box-shadow:0 0 0 1px #f5d58b55}[hidden]{display:none!important}#rotateLeft,#rotateRight{background:#f5d76a;color:#252818;border-color:#ffe89b}#rotateLeft:disabled,#rotateRight:disabled{opacity:.45}#quarterView.selected,#topView.selected,#flatView.selected{animation:viewPulse 1.4s ease-in-out infinite}@keyframes viewPulse{0%,100%{background:#6b7446;box-shadow:0 0 0 1px #f5d58b55}50%{background:#b5a34e;box-shadow:0 0 0 3px #f5d58b99}}@media(prefers-reduced-motion:reduce){#quarterView.selected,#topView.selected,#flatView.selected{animation:none;outline:2px solid #f5d58b}}main{grid-template-columns:minmax(0,3fr) minmax(0,2fr);max-width:none}.tools{grid-column:1/-1}.palette{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));max-height:360px}.palette-heading{grid-column:1/-1}.preview-panel{min-width:0;border:1px solid #a4c18a55;border-radius:16px;background:#173029d9;overflow:hidden}.preview-panel h2{font-size:16px;padding:12px;margin:0}.preview-panel iframe{display:block;width:100%;height:620px;border:0}.mode-tabs{display:none}.preview-page header,.preview-page #brushes,.preview-page .tools,.preview-page .preview-panel{display:none}.preview-page main{display:block;padding:0}.preview-page .board{border:0;border-radius:0}.preview-page .view-options:has(#mapWidth){display:none}.preview-page #edit{display:none}.preview-page .board-footer{min-height:40px}@media(max-width:760px){main{display:block}.preview-panel{margin-bottom:10px}.preview-panel iframe{height:520px}.palette{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}}/* Compact workspace layout */
header{padding:12px 18px}h1{font-size:19px}.brushes{padding:8px 16px;gap:6px}.brush-button{min-width:52px;padding:5px 7px;gap:2px}.brush-button svg{width:32px;height:32px}.brush-button span{font-size:10px}.brush-hint{font-size:11px}#placePlayer{font-size:12px;min-height:58px}#eraseObjects{max-width:90px}
main{grid-template-columns:minmax(0,2fr) minmax(300px,1fr);align-items:start;gap:12px;padding:12px 16px}.board,.tools,.preview-panel{border-radius:12px}.board-bar{padding:8px 10px}.view-options{padding:7px 10px;gap:6px}.view-options button{font-size:12px;padding:7px 9px}.view-options input{width:60px;height:28px;font:inherit}.small-button{height:30px}.board-footer{padding:8px 10px;font-size:11px;min-height:34px}.preview-panel h2{padding:10px;font-size:14px;border-bottom:1px solid #a4c18a44}.preview-panel iframe{height:550px}.tools{grid-column:1;padding:12px}.tools h2{margin-bottom:6px}.palette{grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;max-height:260px;padding:2px 6px 2px 2px}.tile-button{min-height:88px;padding:6px;grid-template-rows:42px auto;gap:3px;font-size:10px;border-radius:8px}.tile-button canvas{width:42px;height:42px}.palette-heading{padding:4px 2px;font-size:11px}.object-heading{margin-top:2px;padding-top:6px}.hint{font-size:11px;margin:8px 0;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}.actions button{padding:8px;margin:0;font-size:12px}.preview-page main{padding:0}.preview-page .view-options{padding:6px}.preview-page .board-bar strong{font-size:12px}.preview-page .viewport{max-height:385px}
@media(max-width:760px){main{display:flex;flex-direction:column;padding:8px;gap:8px}.board,.tools,.preview-panel{width:100%}.board{order:0;margin:0}.tools{order:1}.preview-panel{order:2;margin:0}.preview-panel iframe{height:510px}.brushes{padding:7px 8px}.brush-hint{flex-basis:100%}.board-bar strong{font-size:12px}.palette{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}.preview-page main{display:block;padding:0}.preview-page .tools,.preview-page .preview-panel{display:none}}
.palette{height:240px;max-height:240px;overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable;scrollbar-width:auto;scrollbar-color:#cee1b7 #10221f}.palette::-webkit-scrollbar{width:16px}.palette::-webkit-scrollbar-track{background:#10221f;border-radius:8px}.palette::-webkit-scrollbar-thumb{background:#cee1b7;border:3px solid #10221f;border-radius:8px}.palette::-webkit-scrollbar-thumb:hover{background:#f5d58b}@media(max-width:760px){.palette{height:220px;max-height:220px}}.tools>.brushes{margin:-12px -12px 10px;padding:8px 12px;border-bottom:1px solid #a4c18a44;border-radius:12px 12px 0 0}.tools>.brushes .brush-hint{flex-basis:auto}@media(max-width:760px){.tools>.brushes .brush-hint{flex-basis:100%}}.confirm-viewport{height:385px;overflow:auto;background:#284730}.confirm-viewport canvas{display:block;margin:auto;image-rendering:pixelated}@media(max-width:760px){.confirm-viewport{height:340px}}#heightTools button.selected{animation:viewPulse 1.4s ease-in-out infinite}#heightTools button{min-width:52px}@media(prefers-reduced-motion:reduce){#heightTools button.selected{animation:none}}#eraseTiles{background:#a72e3e;border-color:#ff9da8;color:#fff;min-width:86px;font-size:12px}#eraseTiles.selected{animation:erasePulse 1s ease-in-out infinite}@keyframes erasePulse{0%,100%{background:#8b2534;box-shadow:0 0 0 1px #f66}50%{background:#ef4358;box-shadow:0 0 0 3px #ff8b9a88}}@media(prefers-reduced-motion:reduce){#eraseTiles.selected{animation:none;outline:2px solid #ff7185}}</style>

<body>
  <header><h1>Scrap マップ編集 · v0.2.14</h1></header>
  <div class="view-options mode-tabs" role="tablist" aria-label="作業モード"><button id="editingTab" class="selected" role="tab" aria-selected="true" type="button">編集</button><button id="reviewTab" role="tab" aria-selected="false" type="button">確認</button></div>
  <main>
    <section class="board" aria-label="マップ編集盤面">
      <div class="board-bar"><strong>マップ 24 × 18</strong><div class="zoom"><button id="pan" class="small-button pan-button" type="button" aria-pressed="true">移動</button><button id="edit" class="small-button edit-button" type="button" aria-pressed="false">編集</button><button id="zoomOut" class="small-button" type="button" aria-label="縮小">−</button><span id="zoomValue">100%</span><button id="zoomIn" class="small-button" type="button" aria-label="拡大">＋</button></div></div>
      <div class="view-options"><label>マップ 横<input id="mapWidth" type="number" min="4" max="256" value="64">マス</label><label>縦<input id="mapHeight" type="number" min="4" max="256" value="64">マス</label><button id="resizeMap" type="button">サイズ変更</button></div>
      <div class="view-options"><button id="quarterView" class="selected" type="button" aria-pressed="true">クォータービュー</button><button id="topView" type="button" aria-pressed="false">真上</button><button id="flatView" type="button" aria-pressed="false">横</button><button id="rotateLeft" type="button">左へ90°</button><span id="rotationValue">0°</span><button id="rotateRight" type="button">右へ90°</button><button id="resetAngle" type="button">角度リセット</button><button id="editorGridToggle" type="button" aria-pressed="true">グリッド：ON</button></div>
      <div id="heightTools" class="view-options" role="toolbar" aria-label="配置階層"><strong>配置階層</strong></div><div id="viewport" class="viewport"><div class="map-layer"><canvas id="map" width="768" height="576" aria-label="マップ"></canvas><canvas id="mapOverlay" width="768" height="576" aria-hidden="true"></canvas></div></div>
      <div class="board-footer"><span id="message" role="status">読み込み中</span></div>
    </section>
    <section class="preview-panel" aria-label="確認マップ"><h2>確認</h2><div class="board-bar"><strong id="confirmSize">マップ</strong><div class="zoom"><button id="confirmZoomOut" class="small-button" aria-label="確認を縮小">−</button><span id="confirmZoomValue">40%</span><button id="confirmZoomIn" class="small-button" aria-label="確認を拡大">＋</button></div></div><div class="view-options"><button id="confirm-quarter">クォータービュー</button><button id="confirm-top" class="selected">真上</button><button id="confirm-side">横</button><button id="confirmGrid">グリッド：ON</button></div><div class="confirm-viewport"><canvas id="confirmCanvas" aria-label="確認マップ"></canvas></div><div class="board-footer">編集マップと同じデータを表示しています。</div></section><aside class="tools"><div id="brushes" class="brushes" role="toolbar" aria-label="描画ツール"></div>
      <h2>マップチップ</h2>
      <div id="palette" class="palette" aria-label="塗るチップを選択"></div>
      <p class="hint">地面チップは選択して塗り、オブジェクトは選択して配置します。「オブジェクト消しゴム」はタップしたオブジェクトを消し、地面は残します。選択中の3・5・7マスのアイコンを再度押すと向きが変わります。移動中はマップをスクロールできます。「保存」はこのエディター内の保存です。「書き出し」でJSONを保存できます。ゲームへの読み込み連動は準備中です。「プレイヤー配置」で見え方と通行不可の赤枠を確認できます。</p>
      <div class="actions">
        <button id="save" class="tool-button" type="button">保存</button>
        <button id="export" class="tool-button" type="button">書き出し</button>
        <button id="import" class="tool-button" type="button">読み込み</button>
        <button id="clearMap" class="tool-button" type="button">全消し</button>
      </div>
      <input id="file" type="file" accept=".json,application/json">
    </aside>
  </main>
  <script src="tile-catalog.js?master=1"></script>
  <script src="map-data.js?v=0.2.14"></script>
  <script src="map-collision.js"></script>
  <script src="player-preview.js"></script>
  <script src="brush.js?objects=1"></script>
  <script src="editor.js?v=0.2.14"></script>
</body>
</html>
